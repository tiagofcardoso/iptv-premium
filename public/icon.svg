<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo dark gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#violet)" stroke-width="8" opacity="0.4" />

  <!-- TV Body -->
  <path d="M100 160 C100 140, 116 124, 136 124 L376 124 C396 124, 412 140, 412 160 L412 320 C412 340, 396 356, 376 356 L136 356 C116 356, 100 340, 100 320 Z" fill="url(#violet)" filter="url(#glow)"/>
  
  <!-- TV Screen -->
  <path d="M116 160 C116 148, 126 138, 138 138 L374 138 C386 138, 396 148, 396 160 L396 316 C396 328, 386 338, 374 338 L138 338 C126 338, 116 328, 116 316 Z" fill="url(#screen)"/>

  <!-- Play Triangle -->
  <path d="M226 200 L306 240 L226 280 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- TV Base -->
  <rect x="226" y="356" width="60" height="24" fill="url(#violet)" />
  <path d="M180 396 C180 386, 188 380, 198 380 L314 380 C324 380, 332 386, 332 396 L332 404 C332 408, 328 412, 324 412 L188 412 C184 412, 180 408, 180 404 Z" fill="url(#violet)"/>
</svg>
